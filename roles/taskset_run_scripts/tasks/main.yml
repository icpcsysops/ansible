---
- name: Add taskset to most run scripts
  ansible.builtin.lineinfile:
    path: /usr/local/bin/{{ item }}
    state: present
    regexp: '^(taskset .*)(java|kotlin|pypy)(.*)$'
    backrefs: true
    line: 'taskset -c {{ taskset_cpu }} \2\3'
  loop:
    - runpython3
    - runkotlin
    - runjava

- name: Add taskset to runc/runcpp
  ansible.builtin.lineinfile:
    path: /usr/local/bin/{{ item }}
    state: present
    regexp: '^(taskset .*)?(./a.out)(.*)$'
    backrefs: true
    line: 'taskset -c {{ taskset_cpu }} \2\3'
  loop:
    - runc
    - runcpp
