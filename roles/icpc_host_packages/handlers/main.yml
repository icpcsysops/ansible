---
- name: Restart nginx
  ansible.builtin.service:
    name: nginx
    state: restarted

- name: Systemd-resolved
  ansible.builtin.service:
    name: systemd-resolved
    state: restarted

- name: IptablesLoad
  ansible.builtin.command: /etc/network/if-pre-up.d/iptablesload
  changed_when: false
