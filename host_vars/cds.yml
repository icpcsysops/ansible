---
extra_nic_configs: []
cds_version: latest-unreleased
cds_contest_git_repo: git@packages:contest_repo.git

# CHANGE THESE WHEN IT'S A NEW CONTEST
cds_id: &cds_contest_id nac
cds_path: &cds_contest_path nac
cds_contest_url: &cds_contest_url https://pc2:50450/contests/nac26
# CHANGE ABOVE WHEN IT'S A NEW CONTEST

ccs_user: &ccs_user cds
ccs_pass: &ccs_pass electrician-code-carmine
cds_presentation_domains: &cds_presentation_domains
  - - matveyAdmin
    - matvey
  - - presAdmin
    - presentation
    - balloon
    - coachview
    - deboer
    - nicky
    - mattias
    - michael
  - - p100Admin
    - p100Presentation

# ccs_url: &ccs_url https://domjudge/api/contests/contest_id
# ccs_user: &ccs_user cds
# ccs_pass: &ccs_pass cds-secret-password
# example_cds_presentation_domains: &example_cds_presentation_domains
# - - operationsAdmin
# - operations
