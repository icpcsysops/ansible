---
- name: Restart vlc-screen
  ansible.builtin.service:
    name: vlc-screen
    state: restarted
    daemon_reload: true

- name: Restart vlc-webcam
  ansible.builtin.service:
    name: vlc-webcam
    state: restarted
    daemon_reload: true

- name: Restart vlc-audio
  ansible.builtin.service:
    name: vlc-audio
    state: restarted
    daemon_reload: true
