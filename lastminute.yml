---
- name: Configure backup server
  hosts: backup
  strategy: linear # we want this complete before we do any other hosts
  vars:
    device_uri: 'printers/systemsprint'
    printer_name: systemsprint
  roles:
    - role: dnsmasq
      tags: dnsmasq
    - role: icpc_host_backup
      tags: icpc_host_backup
    # script_server needs to come after the hosts file has been configured (because it needs to lookup some hostnames)
    - role: script_server
      tags: script_server
    - role: cups
  tasks:
    - name: Configure backup as ssh ca server
      ansible.builtin.include_role:
        name: ssh_ca
        tasks_from: ca
      tags: ssh_ca
    - name: Make sure root's key has a pubkey present so we can make a cert for it
      ansible.builtin.shell: >
        ssh-keygen -y -f /root/.ssh/id_ed25519 > /root/.ssh/id_ed25519.pub
      args:
        creates: /root/.ssh/id_ed25519.pub
    - name: Generate ssh cert for root@backup (mainly for gitserver)
      ansible.builtin.include_role:
        name: ssh_ca
        tasks_from: user
      vars:
        ssh_key_to_sign: /root/.ssh/id_ed25519.pub
        ssh_principal: "root@{{ inventory_hostname }}"

- name: Configure packages machines
  hosts: packages
  roles:
    - role: icpc_host_packages
      tags: icpc_host_packages

- name: SSH CA Certs
  hosts: all,!contestants,!coachviews
  gather_facts: true # We need facts so we can limit the user certs to the ip of the host they're tied to
  tags: ssh_ca
  tasks:
    - name: Configure host ssh keys and trust user CA
      ansible.builtin.include_role:
        name: ssh_ca

    # Every host gets an icpc@hostname ssh certificate, and hosts allow those keys to log in by adding the names to
    # ~/.ssh/authorized_principals. E.g. if you add icpc@cds to the file, then the icpc user on the cds has a key that will allow it to log in.
    # A more practical example might be for the ccsadmins to all be allowed to log into the ccs server, or judgehosts, etc. So they don't have
    # to distribute their own keys to every machine manually.
    - name: Make sure the .ssh directory exists
      ansible.builtin.file:
        path: /home/icpc/.ssh
        state: directory
        mode: "0700"
        owner: icpc
        group: icpc
    - name: Ensure id_ed25519 key for icpc@icpc
      community.crypto.openssh_keypair:
        path: /home/icpc/.ssh/id_ed25519
        type: ed25519
        owner: icpc
        group: icpc
    - name: Generate ssh cert for the key we just made
      ansible.builtin.include_role:
        name: ssh_ca
        tasks_from: user
      vars:
        ssh_key_to_sign: /home/icpc/.ssh/id_ed25519.pub
        ssh_principal: "icpc@{{ inventory_hostname }}"

- name: Pre-configure apt
  hosts: all
  roles:
    - role: apt
      tags: apt
  tasks:
    - name: Fix LC_TIME
      ansible.builtin.lineinfile:
        path: /etc/default/locale
        regexp: ^LC_TIME
        line: LC_TIME="en_US.UTF-8"
      tags: fix_LC_TIME
    - name: Fix LC_PAPER
      ansible.builtin.lineinfile:
        path: /etc/default/locale
        regexp: ^LC_PAPER
        line: LC_PAPER="en_US.UTF-8"
      tags: fix_LC_PAPER

- name: Configure scoreboard machine
  hosts: packages,scoreboard
  roles:
    - role: scoreboard
      tags: scoreboard

- name: Configure extra_nic machines
  hosts: backup, scoreboard, printsrv, cds, packages
  tags: extra_nics
  tasks:
    - name: Configure nics
      ansible.builtin.include_role:
        name: extra_nic
      vars:
        extra_nic_config: "{{ item }}"
      loop: "{{ extra_nic_configs }}"

- name: Configure coachview machines
  hosts: coachview*
  roles:
    - role: coachview
  tasks:
    - name: Update root password (if root_password already crypted)
      ansible.builtin.user:
        name: "root"
        state: present
        password: "{{ root_password }}"
      when:
        - root_password is defined and root_password is not none
        - '"$6$" in root_password'
      tags: do_root_passwd

    - name: Update root password (if root_password is cleartext)
      ansible.builtin.user:
        name: "root"
        state: present
        password: "{{ root_password | password_hash('sha512', root_password) }}"
      when:
        - root_password is defined and root_password is not none
        - '"$6$" not in root_password'
    - name: Remove icpc and team user from img
      ansible.builtin.user:
        name: "{{ item }}"
        state: absent
      loop:
        - "icpc"
        - "team"
      when: root_password is defined and root_password is not none

- name: Configure everything but contestants and ntpservers to use backup for dns
  hosts: all,!contestants,!ntpservers
  tasks:
    - name: Configure dns client
      ansible.builtin.import_role:
        name: dnsmasq
        tasks_from: client.yml
      tags: dnsmasq

- name: Configure servers (but not DOMjudge) to run node exporter
  hosts: all:!dom*
  roles:
    - role: prometheus_target_all
      tags: prom

- name: Configure contestant machines
  hosts: contestants
  roles:
    - role: cups
    - role: team
    - role: mediamtx
      when: enable_hls is defined and enable_hls
    #    - role: hyperthreadingdisabled
    - role: tunecpulaptop
    - role: reverseproxy
      when: enable_reverseproxy is defined and enable_reverseproxy
    - role: p100
      tags: p100
    - role: taskset_run_scripts
    - role: vlc
      when: enable_vlc is defined and enable_vlc
      tags: vlc
    - role: iptablesrules
      tags: iptablesrules
    - role: martkeys
      when: disable_martkeys is not defined or not disable_martkeys

  tasks:
    - name: Install python3-tk
      ansible.builtin.apt:
        name: python3-tk
      tags: install_tk
    - name: Fix /usr/bin/clion
      ansible.builtin.file:
        src: /opt/clion/bin/clion
        dest: /usr/bin/clion
        force: true
        state: link
      tags: fix_clion

    - name: Install a2ps
      ansible.builtin.apt:
        name: a2ps

    - name: Install printfile
      ansible.builtin.copy:
        src: files/printfile
        dest: /usr/local/bin/printfile
        mode: '0755'
        owner: root
        group: root
    - name: Remove network-manager so teams can't wifi things or whatnot
      ansible.builtin.apt:
        name: network-manager
        purge: true
        autoremove: true

    # more things to fix in icpc-pycharm
    - name: Fix location in printers.conf
      ansible.builtin.lineinfile:
        state: absent
        path: /etc/cups/printers.conf
        regexp: ^Location.*
      tags: fix_location
      notify: Restart cups

    # TODO fix this in icpc2025
    - name: Fix idea binary when launching from cli by making it a symlink to the same executable the desktop icon uses
      ansible.builtin.file:
        src: /usr/lib/idea/bin/idea.sh
        dest: /usr/bin/idea
        state: link
        force: true

    - name: Remove invalid runconfiguration from pycharm workspace
      tags: pycharm_fix
      ansible.builtin.file:
        state: absent
        path: /etc/skel/workspace/PycharmProject/.idea/runConfigurations/pypy3.xml

    - name: Include ccstools role only for domjudge
      ansible.builtin.include_role:
        name: ccstools
      tags: ccstools
      when: ccs == "domjudge"

    - name: Replace SUBMITBASEURL for current contest in /etc/profile.d/pc2submit_profile.sh
      ansible.builtin.lineinfile:
        path: /etc/profile.d/pc2submit_profile.sh
        regexp: '^export SUBMITBASEURL=.*$'
        line: 'export SUBMITBASEURL=https://pc2server:50443'
      tags: ccstools
      when: ccs == "pc2"

    - name: Add pc2server to /etc/hosts
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: '10.3.3.214	pc2server'
        owner: root
        group: root
        mode: '0644'
      tags: ccstools
      when: ccs == "pc2"

    # TODO fixed in this to icpc2024
    - name: Disable idle-dim
      ansible.builtin.copy:
        dest: /usr/share/glib-2.0/schemas/21_icpc_power_schema.gschema.override
        content: |
          [org.gnome.settings-daemon.plugins.power]
          idle-dim=false
        mode: '0644'
      notify: Glib-compile-schemas

    - name: Cleanup domjudge.desktop,  renaming to ccs.desktop
      ansible.builtin.file:
        name: /usr/share/applications/domjudge.desktop
        state: absent

    - name: Install stress-ng
      ansible.builtin.apt:
        pkg: stress-ng
        state: present

    - name: Disable systemd-resolved
      ansible.builtin.systemd:
        name: systemd-resolved
        state: stopped
        enabled: false
        masked: true
      # don't disable dns if we're using public packages
      when: not disable_sources_list_changes

    # local accounts bit
    - name: Create group teams
      ansible.builtin.group:
        name: teams
        gid: 3000

    - name: Copy the per contest bits
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "/root/{{ contest }}.teams.tar.gz"
        mode: '0600'
      with_first_found:
        - files:
            - "{{ contest }}.teams.tar.gz"
          skip: true

    - name: Remove icpc and team user from img
      ansible.builtin.user:
        name: "{{ item }}"
        state: absent
      loop:
        - "icpc"
        - "team"
      when: root_password is defined and root_password is not none

    - name: Workaround nautilus auto-mounting
      ansible.builtin.file:
        path: /media
        owner: root
        group: root
        mode: "0700"

    - name: Use policykit to disable power management for teams
      ansible.builtin.copy:
        dest: /etc/polkit-1/rules.d/48-prevent-shutdown.rules
        content: |
          polkit.addRule(function(action, subject) {
              if (action.id == "org.freedesktop.login1.reboot" ||
                   action.id == "org.freedesktop.login1.reboot-multiple-sessions" ||
                   action.id == "org.freedesktop.login1.power-off" ||
                   action.id == "org.freedesktop.login1.power-off-multiple-sessions" ||
                   action.id == "org.freedesktop.login1.suspend" ||
                   action.id == "org.freedesktop.login1.suspend-multiple-sessions" ||
                   action.id == "org.freedesktop.login1.hibernate" ||
                   action.id == "org.freedesktop.login1.hibernate-multiple-sessions")
              {
                   return polkit.Result.NO;
              }
          });
        mode: '0644'
    - name: Use policykit to disable mounting for teams
      ansible.builtin.copy:
        dest: /etc/polkit-1/rules.d/99-disable-udisks.rules
        content: |
          polkit.addRule(function(action, subject) {
            if (action.id.startsWith("org.freedesktop.udisks2."))
            {
              return polkit.Result.NO;
            }
          });
        mode: '0644'
    - name: Use policykit to disable access to networkmanager
      ansible.builtin.copy:
        dest: /etc/polkit-1/rules.d/99-disable-networkmanager.rules
        content: |
          polkit.addRule(function(action, subject) {
            if (action.id.startsWith("org.freedesktop.NetworkManager."))
            {
              return polkit.Result.NO;
            }
          });
        mode: '0644'
    - name: Fix gvfsd permission tweaking to disable
      ansible.builtin.file:
        path: /usr/libexec/{{ item }}
        owner: root
        group: root
        mode: "0744"
      loop:
        - "gvfsd-burn"
        - "gvfsd-computer"
        - "gvfsd-localtest"

    - name: Pre-generate the kernel flags for ansible usage
      ansible.builtin.set_fact:
        procline: "quiet ipv6.disable=1 cgroup_enable=memory swapaccount=1 i915.force_probe=4690"

    - name: Ensure /etc/default/grub has proper GRUB_CMDLINE_LINUX_DEFAULT
      ansible.builtin.replace:
        path: /etc/default/grub
        regexp: '^GRUB_CMDLINE_LINUX_DEFAULT=.*$'
        replace: "GRUB_CMDLINE_LINUX_DEFAULT=\"{{ procline }}\""
        owner: root
        group: root
        mode: '0644'
      notify:
        - Update grub
        - Reboot

    - name: Place 21_icpc-disable-automount-schema.gschema.override
      ansible.builtin.copy:
        content: |
          [org.gnome.desktop.media-handling]
          automount-open=false
          automount=false
        dest: /usr/share/glib-2.0/schemas/21_icpc-disable-automount-schema.gschema.override
        owner: root
        group: root
        mode: '0644'
      notify: Glib-compile-schemas

    - name: Copy fixed runc and runcpp scripts
      ansible.builtin.copy:
        src: files/{{ item }}
        dest: /usr/local/bin/{{ item }}
        mode: '0755'
        owner: root
        group: root
      loop:
        - runc
        - runcpp
  handlers:
    - name: Glib-compile-schemas
      ansible.builtin.command: glib-compile-schemas /usr/share/glib-2.0/schemas
      changed_when: false
    - name: Reboot
      ansible.builtin.reboot:
    - name: Update grub
      ansible.builtin.command: /usr/sbin/update-grub
      changed_when: false
    - name: Restart cups
      ansible.builtin.service:
        name: cups
        state: restarted

- name: Send syslogs to `backup`
  hosts: all:!backup
  tasks:
    - name: Point rsyslog to backup
      ansible.builtin.copy:
        content: |
          # ship the important logs to backup
          kern.warning                    @backup
          auth,authpriv.*                 @backup
        dest: /etc/rsyslog.d/70-clients.conf
        owner: root
        group: root
        mode: '0644'
      notify: Restart rsyslog
  handlers:
    - name: Restart rsyslog
      ansible.builtin.service:
        name: rsyslog
        state: restarted

- name: Install/configure systemd-timesyncd on everything but the ntp servers
  hosts: all:!ntpservers
  roles:
    - role: stuvusIT.systemd-timesyncd
      timesync_timezone: "{{ timezone }}"
      timesync_ntp_hosts: "{{ ntp_hosts }}"
      timesync_fallback_ntp_hosts: "{{ fallback_ntp_hosts }}"
      tags: systemd-timesyncd

- name: Set up our ntp servers
  hosts: ntpservers
  roles:
    - role: ntp
      tags: ntp

- name: Lastminute config for all hosts
  hosts: all
  roles:
    - role: firefox_desktop

  vars:
    judging_notes: "{{ '/root/ansible/files/%s.JudgingNotes.%s.pdf'|format(contest_detail, papersize) }}"
    tech_notes: "{{ '/root/ansible/files/%s.TechNotes.%s.pdf'|format(contest_detail, papersize) }}"

  tasks:
    # will be fixed in icpc2026
    - name: Ensure /etc/ssh/sshd_config.d/50-cloud-init.conf does not exist
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d/50-cloud-init.conf
        state: absent
      notify: Restart sshd

    # stat file first
    - name: Get file stat of JudgingNotes to be able to perform a check in the following task
      tags: icpc_docs
      delegate_to: localhost
      ansible.builtin.stat:
        path: "{{ judging_notes }}"
      register: judgingnotes

    - name: Copy JudgingNotes.pdf
      tags: icpc_docs
      ansible.builtin.copy:
        src: "{{ judging_notes }}"
        dest: /usr/share/doc/icpc/JudgingNotes.pdf
        mode: '0644'
      when: judgingnotes.stat.exists

    - name: Get file stat of TechNotes to be able to perform a check in the following task
      tags: icpc_docs
      delegate_to: localhost
      ansible.builtin.stat:
        path: "{{ tech_notes }}"
      register: technotes

    - name: Copy TechNotes.pdf
      tags: icpc_docs
      ansible.builtin.copy:
        src: "{{ tech_notes }}"
        dest: /usr/share/doc/icpc/TechNotes.pdf
        mode: '0644'
        owner: root
        group: root
      when: technotes.stat.exists

    - name: Ensure /etc/default/grub has proper GRUB_TIMEOUT
      ansible.builtin.replace:
        path: /etc/default/grub
        regexp: "GRUB_TIMEOUT=.*"
        replace: "GRUB_TIMEOUT=3"
        owner: root
        group: root
        mode: '0644'
      notify:
        - Update grub

    - name: Update root password (if root_password already crypted)
      ansible.builtin.user:
        name: "root"
        state: present
        password: "{{ root_password }}"
      when:
        - root_password is defined and root_password is not none
        - '"$6$" in root_password'
      tags: do_root_passwd

    - name: Update root password (if root_password is cleartext)
      ansible.builtin.user:
        name: "root"
        state: present
        password: "{{ root_password | password_hash('sha512', root_password) }}"
      when:
        - root_password is defined and root_password is not none
        - '"$6$" not in root_password'

    - name: Get GIT revision
      ansible.builtin.shell: |
          set -o pipefail
          git rev-list --full-history --all --abbrev-commit | head -1
          exit 0
      args:
        executable: /bin/bash
      become: false
      register: git_revision
      delegate_to: localhost
      changed_when: false

    - name: Ensure apport is not installed
      ansible.builtin.package:
        pkg: apport
        state: absent

    - name: Log version of script on client
      community.general.syslogger:
        ident: "lastminute"
        msg: "Ansible applied {{ version }} - ({{ git_revision.stdout }})"
        priority: "notice"
      changed_when: false
  handlers:
    - name: Update grub
      ansible.builtin.command: /usr/sbin/update-grub
      changed_when: false
    - name: Reboot
      ansible.builtin.reboot:
      when: reboot_enabled
    - name: Restart sshd
      ansible.builtin.service:
        name: ssh
        state: restarted


- name: Configure the reverse proxy
  hosts: reverseproxy
  roles:
    - role: reverseproxy
      reverseproxy_server: true
      tags: reverseproxy

- name: Configure packages as the gitserver
  hosts: packages
  roles:
    - role: gitserver
      tags: gitserver

- name: Clone the contest git repo on backup
  hosts: backup
  tasks:
    - name: Clone the contest git repo
      ansible.builtin.git:  # noqa: latest[git]
        repo: "git@packages:contest_repo.git"
        dest: /root/contest_repo
      when: clone_contest_repo is defined and clone_contest_repo|bool

- name: Configure the cds instances (new style)
  hosts: cds*
  roles:
    - role: cds
      tags: cds
    - role: cds_for_icpc
      tags: cds_for_icpc

- name: Configure balloonmanager printers
  hosts: balloonmanager
  vars:
    device_uri: 'printers/balloonprinter'
    printer_name: balloonprinter
  roles:
    - role: cups
    - role: balloonprinter

- name: Configure ccsadmin printers
  hosts: ccsadmin*
  vars:
    device_uri: 'printers/systemsprinter'
    printer_name: systemsprinter
  roles:
    - role: cups

- name: Configure judges printers
  hosts: judge*
  vars:
    device_uri: 'printers/systemsprinter'
    printer_name: systemsprinter
  roles:
    - role: cups
  tasks:
    - include_role:
        name: ccstools
      when: ccs  == "domjudge"
    - include_role:
        name: reverseproxy
      when: enable_reverseproxy is defined and enable_reverseproxy

- name: Configure others printers
  hosts: others:!printsrv
  vars:
    device_uri: 'printers/systemsprinter'
    printer_name: systemsprinter
  roles:
    - role: cups

- name: Configure printserver
  hosts: printsrv
  roles:
    - role: printserver
      tags: printserver

- name: Set isolcpus to 3 for pc2-ajs
  hosts: pc2-aj*,pc2-ccsadmin*
  gather_facts: false
  tasks:
    - name: Pre-generate the kernel flags for ansible usage
      ansible.builtin.set_fact:
        procline: "quiet ipv6.disable=1 cgroup_enable=memory swapaccount=1 i915.force_probe=4690 isolcpus=3"
    - name: Ensure /etc/default/grub has proper GRUB_CMDLINE_LINUX_DEFAULT
      ansible.builtin.replace:
        path: /etc/default/grub
        regexp: '^GRUB_CMDLINE_LINUX_DEFAULT=.*$'
        replace: "GRUB_CMDLINE_LINUX_DEFAULT=\"{{ procline }}\""
        owner: root
        group: root
        mode: '0644'
      notify:
        - Update grub
        - Reboot

    - name: Ensure /etc/default/grub has proper GRUB_TIMEOUT
      ansible.builtin.replace:
        path: /etc/default/grub
        regexp: "GRUB_TIMEOUT=.*"
        replace: "GRUB_TIMEOUT=3"
        owner: root
        group: root
        mode: '0644'
      notify:
        - Update grub
        - Reboot

  handlers:
    - name: Update grub
      ansible.builtin.command: /usr/sbin/update-grub
      changed_when: false
    - name: Reboot
      ansible.builtin.reboot:

- name: Configure analysts
  hosts: analysts
  roles:
    - role: ccstools

- name: Wrap up
  hosts: all,!contestants
  tasks:
    - name: Grab some build content
      ansible.builtin.shell: >
        set -o pipefail &&
        echo "Provisioned at $(date +"%Y-%m-%d %H:%M:%S")\nRevision: $(git rev-list --full-history --all --abbrev-commit | head -1)\n"
      args:
        executable: /bin/bash # needed for pipefail
      become: false
      register: git_revision
      delegate_to: 127.0.0.1
      changed_when: git_revision.rc != 0  # <- Uses the return code to define when the task has changed.

    - name: Create a file on the desktop indicating ansible has finished
      ansible.builtin.copy:
        content: "{{ git_revision.stdout }}\n"
        dest: /home/icpc/Desktop/Ansible_Done.txt
        owner: icpc
        group: icpc
        mode: "0644"
