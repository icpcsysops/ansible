# - presentation
# - balloon
# - coachview

cds_config:
  cds:
    http_port: 80
    https_port: 443
    contests:
      - name: *cds_contest_id
        path: *cds_contest_path
        video:
          desktop: http://team{0}:9090
          webcam: http://team{0}:8080
    #     audio: http://team{0}:7070
        ccs:
          url: *cds_contest_url
          username: *ccs_user
          password: *ccs_pass
    # Path to a yaml file inside vars/ containing an accounts array
    accounts: /root/contest_repo/servers/cds/config/accounts.yaml
    domains: *cds_presentation_domains
  live:
    http_port: 7080
    https_port: 7443
    accounts: /root/contest_repo/servers/live/config/accounts.yaml
    contests:
      - name: *cds_contest_id
        path: *cds_contest_path
        record_reactions: true
        video:
          desktop: http://team{0}:9090
          webcam: http://team{0}:8080
    #     audio: http://team{0}:7070
        ccs:
          url: *cds_contest_url
          username: *ccs_user
          password: *ccs_pass
  collusion:
    http_port: 6080
    https_port: 6443
    accounts: /root/contest_repo/servers/collusion/config/accounts.yaml
    contests:
      - name: *cds_contest_id
        path: *cds_contest_path
        ccs:
          url: *cds_contest_url
          username: *ccs_user
          password: *ccs_pass
